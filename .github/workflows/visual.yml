name: Visual

# Capture every story, compare against the baseline in the store, publish the
# review report, and link it from the pull request.
#
# The verdict is the `Visual` commit status, not this job: a job has no third
# colour, and "changes are waiting for a human" is the state that matters.
# Yellow until someone accepts them, green when nothing moved or they did.
#
# The container tag is pinned to the exact `playwright` version in package.json.
# That pairing is the whole determinism story: baselines are only ever produced
# by this image, so a developer's font stack can never enter the manifest.
on:
  pull_request:
  # Main is the baseline: its run captures with `--accept`, so what main looks
  # like now is what every pull request compares against.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to push new blobs to the store branch
  pull-requests: write
  id-token: write # OIDC into AWS; no long-lived keys
  statuses: write # the verdict is a commit status

jobs:
  snap:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v6

      # The Playwright image already ships node and the matching browsers.
      - run: corepack enable && yarn install --immutable

      - run: yarn build-storybook

      # With no bucket configured the store lives on an orphan branch that
      # GitHub Pages serves. Cloning it gives the run both the baselines it
      # needs to diff against and somewhere publicly readable to put the new
      # images — which is the only reason they can render inline in a comment.
      # GitHub's image proxy fetches anonymously, so a private URL shows nothing.
      - name: Check out the snapshot store
        if: vars.SNAPINATOR_STORE == ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory '*'
          git clone --quiet --depth 1 --branch visual-store \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .snapinator/store

      # Skipped when the repository has no store configured, so a fresh clone
      # still produces a report — as a workflow artifact instead of on S3.
      - uses: aws-actions/configure-aws-credentials@v6
        if: vars.SNAPINATOR_STORE != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # `--accept` on main and nowhere else: main defines the baseline, so its
      # capture writes one rather than complaining about the last one.
      #
      # Exit 1 is "something moved", which the `Visual` status reports and this
      # job has no business failing over. Exit 2 is the tool breaking — an
      # unreadable store, a browser that never launched — and that is red.
      - name: Capture and compare
        env:
          SNAPINATOR_STORE: ${{ vars.SNAPINATOR_STORE }}
          SNAPINATOR_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SNAPINATOR_OVERLAY: ${{ github.event_name == 'pull_request' && format('baseline/pr-{0}.json', github.event.pull_request.number) || '' }}
          # Only main writes the proof a pull request reads: its baseline is the
          # one every branch is measured against, and a branch recording its own
          # build there would offer other branches a verdict on a tree nobody
          # merged. Writing it also means not reading it — see snap.mjs.
          SNAPINATOR_CACHE_WRITE: ${{ github.event_name == 'push' && '1' || '0' }}
        run: |
          node scripts/snap.mjs ${{ github.event_name == 'push' && '--accept' || '' }} ||
            { code=$?; [ "$code" = 1 ] || exit "$code"; }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report
          path: .snapinator/run/report
          if-no-files-found: ignore

      # Only a fork's read-only token may fail here. On main a lost push is a
      # baseline that silently did not move, which is the whole failure this
      # design exists to prevent.
      - name: Publish the store
        if: vars.SNAPINATOR_STORE == ''
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        working-directory: .snapinator/store
        env:
          MESSAGE: "chore: snapshots from run ${{ github.run_id }}"
        run: sh ../../scripts/publish-store.sh

      # Pages takes a moment to serve a fresh push, and GitHub's image proxy
      # caches what it finds on first fetch — including a 404. Wait for the
      # images to be live before anything links to them.
      - name: Wait for Pages to serve the new images
        if: vars.SNAPINATOR_STORE == '' && vars.SNAPINATOR_PUBLIC_URL != ''
        env:
          BASE: ${{ vars.SNAPINATOR_PUBLIC_URL }}
        run: |
          [ -f .snapinator/run/report/summary.json ] || exit 0
          hash=$(node -e "
            const s = require('./.snapinator/run/report/summary.json');
            const first = [...s.changed, ...s.added][0];
            process.stdout.write(first ? first.hash : '');
          ")
          [ -n "$hash" ] || { echo "Nothing moved; nothing to wait for."; exit 0; }
          for _ in $(seq 1 36); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "${BASE}/img/${hash}.png")" = 200 ]; then
              echo "Pages is serving the new images."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Pages has not picked up the new images yet; the comment may show gaps for a minute."

      # The diff is rendered *into* the comment, not linked from it. Someone who
      # changed a colour in the GitHub web editor never has to leave the tab,
      # install anything, or know this tool exists.
      - name: Comment the report and settle the check
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPINATOR_PUBLIC_URL: ${{ vars.SNAPINATOR_PUBLIC_URL }}
          SNAPINATOR_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/pr-comment.mjs ${{ github.event.pull_request.number }}
