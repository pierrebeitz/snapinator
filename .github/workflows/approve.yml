name: Approve visual

# `/approve-visual` on a pull request moves the baseline.
#
# This is the whole "approval service". There is no server, no database and no
# session: GitHub already knows who may write to the repository, and that is
# exactly the question an approve button has to answer. `author_association`
# is the answer, and the audit log is the commit history.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  statuses: write # to settle the check on the commit this makes

jobs:
  approve:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/approve-visual') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes

      - name: Resolve the pull request head
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.issue.number }}" \
            --jq '"ref=\(.head.ref)\nrepo=\(.head.repo.full_name)"' >> "$GITHUB_OUTPUT"

      # Note: GITHUB_TOKEN cannot push to a fork. For fork pull requests this
      # step needs a token that can, or the contributor runs `yarn snap:accept`
      # themselves and commits the manifest.
      - uses: actions/checkout@v6
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the run being approved
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The Visual workflow stamps its run id into the marker of the one
          # comment it edits in place. Read it back from there rather than
          # keeping state anywhere else.
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            --jq 'map(select(.body | startswith("<!-- snapinator"))) | last.body' \
            | head -1 | grep -oE 'run=[^ ]+' | cut -d= -f2 \
            | sed 's/^/id=/' >> "$GITHUB_OUTPUT"
          grep -q 'id=' "$GITHUB_OUTPUT" || { echo "No snapinator comment to approve."; exit 1; }

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: aws-actions/configure-aws-credentials@v6
        if: vars.SNAPINATOR_STORE != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Without a bucket the store is the Pages branch, and snap.mjs already
      # published this run's summary there. Clone it and accept.mjs cannot tell
      # the difference between that and S3.
      - name: Check out the snapshot store
        if: vars.SNAPINATOR_STORE == ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch visual-store \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .snapinator/store

      # No Storybook build and no browser: the pixels are already in the store
      # under their content hash, so this is a manifest edit and nothing more.
      - name: Move the baseline
        env:
          SNAPINATOR_STORE: ${{ vars.SNAPINATOR_STORE }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          # `cut -f2-` would hand back the whole line when there is no space,
          # turning a bare `/approve-visual` into a story id. Strip the command
          # instead; what remains is empty (accept everything) or a list.
          line=$(printf '%s' "$COMMENT" | head -1)
          ids="${line#/approve-visual}"
          node scripts/accept.mjs "${{ steps.run.outputs.id }}" $ids

      - name: Commit
        id: commit
        env:
          APPROVER: ${{ github.event.comment.user.login }}
        run: |
          if git diff --quiet snapshots.json; then
            echo "Manifest already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots.json
          git commit -m "chore(visual): accept baselines approved by @${APPROVER}"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN deliberately does not start a workflow, so
      # the new commit would sit at `action_required` forever and block the
      # merge. Settle the check here: the manifest was written from the hashes
      # of the run a human just looked at, so re-capturing could only introduce
      # a disagreement with what they approved.
      #
      # Push with a PAT or a GitHub App token instead if you would rather have
      # a genuine second run.
      - name: Settle the check on the new commit
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVER: ${{ github.event.comment.user.login }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${{ steps.commit.outputs.sha }}" \
            -f state=success \
            -f context="Visual" \
            -f description="Baselines approved by @${APPROVER}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
