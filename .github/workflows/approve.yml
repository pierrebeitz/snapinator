name: Approve visual

# `/approve-visual` on a pull request moves the baseline.
#
# This is the whole "approval service". There is no server, no database and no
# session: GitHub already knows who may write to the repository, and that is
# exactly the question an approve button has to answer. `author_association`
# is the answer, and the audit log is the commit history.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  statuses: write # to settle the check on the commit this makes

jobs:
  approve:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/approve-visual') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes

      # The sha as well as the ref: the check being settled hangs on the commit
      # the reviewer looked at, and naming the branch instead would settle
      # whatever landed on it since.
      - name: Resolve the pull request head
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.issue.number }}" \
            --jq '"ref=\(.head.ref)\nrepo=\(.head.repo.full_name)\nsha=\(.head.sha)"' >> "$GITHUB_OUTPUT"

      # For the scripts, not to write to: approving touches the store and the
      # check, never the pull request's own branch.
      - uses: actions/checkout@v6
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.ref }}

      - name: Find the run being approved
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The Visual workflow stamps its run id into the marker of the one
          # comment it edits in place. Read it back from there rather than
          # keeping state anywhere else.
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            --jq 'map(select(.body | startswith("<!-- snapinator"))) | last.body' \
            | head -1 | grep -oE 'run=[^ ]+' | cut -d= -f2 \
            | sed 's/^/id=/' >> "$GITHUB_OUTPUT"
          grep -q 'id=' "$GITHUB_OUTPUT" || { echo "No snapinator comment to approve."; exit 1; }

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: aws-actions/configure-aws-credentials@v6
        if: vars.SNAPINATOR_STORE != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Without a bucket the store is the Pages branch, and snap.mjs already
      # published this run's summary there. Clone it and accept.mjs cannot tell
      # the difference between that and S3.
      - name: Check out the snapshot store
        if: vars.SNAPINATOR_STORE == ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch visual-store \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .snapinator/store

      # No Storybook build and no browser: the pixels are already in the store
      # under their content hash, so this is one overwritten pointer.
      - name: Move the baseline
        env:
          SNAPINATOR_STORE: ${{ vars.SNAPINATOR_STORE }}
          SNAPINATOR_OVERLAY: baseline/pr-${{ github.event.issue.number }}.json
        run: node scripts/accept.mjs "${{ steps.run.outputs.id }}"

      # Without a bucket the store is the Pages branch, so the overlay accept.mjs
      # just wrote is a commit on that branch — never on the pull request's own.
      - name: Publish the store
        if: vars.SNAPINATOR_STORE == ''
        working-directory: .snapinator/store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -qm "chore(visual): accept baselines approved by @${{ github.event.comment.user.login }}"
            git push -q origin HEAD:visual-store
          fi

      # No commit to the branch and no re-capture: the overlay is what the next
      # run reads, and this settles the check for the commit the reviewer was
      # actually looking at. Re-running the suite to record a decision would
      # cost a full capture to reach the same answer.
      - name: Settle the check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVER: ${{ github.event.comment.user.login }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=success \
            -f context="Visual" \
            -f description="Approved by @${APPROVER}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
